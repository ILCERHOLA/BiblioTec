name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  compilar:
    name: Compilar y verificar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
       uses: actions/checkout@v6

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar, ejecutar pruebas y empaquetar
        run: mvn -B clean verify

      - name: Guardar el WAR generado
        uses: actions/upload-artifact@v6
        with:
          name: bibliotec-war
          path: target/*.war